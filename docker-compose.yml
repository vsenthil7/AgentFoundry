# AgentFoundry — base compose. One service: API + web console on one port.
# IMPORTANT: this base file does NOT publish a host port. On any host, the
# host-port mapping is owned entirely by docker-compose.override.yml (see
# deploy/DEPLOY.md). This avoids the merge-collision where a fixed base port
# (e.g. 8080) is already taken on a shared host and the override's port is
# appended rather than replacing it. Container listens on 8080 internally.
services:
  agentfoundry:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentfoundry:latest
    container_name: agentfoundry
    restart: unless-stopped
    environment:
      - PORT=8080
      - AF_DATA=/data
      - AF_WEB_DIST=/app/web/dist
    expose:
      - "8080"
    volumes:
      - agentfoundry-data:/data

volumes:
  agentfoundry-data:
